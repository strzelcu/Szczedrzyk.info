name: Update data and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore last available measurements
        uses: actions/cache/restore@v4
        with:
          path: .data-cache
          key: measurements-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: measurements-
      - name: Fetch public data
        run: npm run data
      - name: Save last available measurements
        uses: actions/cache/save@v4
        with:
          path: .data-cache
          key: measurements-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static dashboard
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
